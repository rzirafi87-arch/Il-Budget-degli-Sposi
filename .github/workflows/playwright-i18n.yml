name: Playwright i18n matrix

on:
  pull_request:
    branches:
      - main
    paths:
      - "e2e/**"
      - "playwright.config.ts"
      - "src/app/**"
      - "src/components/**"
      - "src/messages/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            .playwright-results/
